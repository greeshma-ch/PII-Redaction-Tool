<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PII Redaction Tool — Case File</title>
  <meta name="description" content="Upload a .docx document and redact personally identifiable information with consistent fake replacements. Visual before/after diff view.">

  <!-- Fonts: Fraunces (headline), IBM Plex Mono (data), Public Sans (body) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700&family=IBM+Plex+Mono:wght@400;600&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">

  <style>
    /* ── Tokens ──────────────────────────────────────────── */
    :root {
      --paper:       #DEDBD1;
      --ink:         #1C1B19;
      --folder-tan:  #C7A76B;
      --redact-black:#0B0B0C;
      --stamp-red:   #9C3B2E;
      --caution:     #D9A62E;
      --panel-bg:    #E8E5DC;
      --border:      1px solid var(--folder-tan);
    }

    /* ── Reset / Base ────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { font-size: 15px; }
    body {
      font-family: 'Public Sans', system-ui, sans-serif;
      background: var(--paper);
      color: var(--ink);
      min-height: 100vh;
    }

    /* ── Top Bar ─────────────────────────────────────────── */
    .top-bar {
      border-bottom: var(--border);
      padding: 14px 28px;
      display: flex;
      align-items: baseline;
      gap: 16px;
    }
    .top-bar h1 {
      font-family: 'Fraunces', serif;
      font-weight: 700;
      font-size: 1.35rem;
      letter-spacing: -0.01em;
    }
    .top-bar .case-number {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      color: var(--stamp-red);
      text-transform: uppercase;
    }

    /* ── Layout ──────────────────────────────────────────── */
    .app {
      max-width: 1400px;
      margin: 0 auto;
      padding: 24px 28px 60px;
    }

    /* ── Upload Panel ────────────────────────────────────── */
    .upload-panel {
      border: var(--border);
      background: var(--panel-bg);
      padding: 32px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .upload-panel.drag-over {
      border-color: var(--caution);
      border-style: dashed;
    }
    .upload-label {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--stamp-red);
    }
    .upload-panel p {
      font-size: 0.85rem;
      color: #666;
    }

    /* File input */
    .file-input-wrap {
      position: relative;
    }
    .file-input-wrap input[type="file"] {
      position: absolute; inset: 0;
      opacity: 0; cursor: pointer;
    }
    .file-btn {
      display: inline-block;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 24px;
      border: var(--border);
      background: var(--paper);
      color: var(--ink);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .file-btn:hover {
      background: var(--folder-tan);
      color: #fff;
    }

    .selected-file {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--ink);
    }

    .redact-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.85rem;
      font-weight: 600;
      padding: 12px 36px;
      border: 2px solid var(--stamp-red);
      background: var(--stamp-red);
      color: #fff;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    .redact-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .redact-btn:not(:disabled):hover {
      background: #7A2E23;
      border-color: #7A2E23;
    }

    /* ── Progress ────────────────────────────────────────── */
    .progress-bar-wrap {
      display: none;
      width: 100%;
      max-width: 480px;
      margin: 8px auto 0;
    }
    .progress-bar-wrap.active { display: block; }
    .progress-track {
      height: 4px;
      background: var(--folder-tan);
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: var(--caution);
      width: 0%;
      transition: width 0.3s ease;
    }
    .progress-status {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      color: var(--caution);
      text-align: center;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* ── Results Bar ─────────────────────────────────────── */
    .results-bar {
      display: none;
      border: var(--border);
      background: var(--panel-bg);
      padding: 16px 24px;
      margin-top: 20px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    .results-bar.active { display: flex; }

    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .stat {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
    }
    .stat-value {
      font-weight: 600;
      font-size: 1rem;
    }
    .stat-label {
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #777;
      font-size: 0.65rem;
    }

    .download-btn {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      font-weight: 600;
      padding: 10px 24px;
      border: 2px solid var(--ink);
      background: var(--ink);
      color: var(--paper);
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      text-decoration: none;
    }
    .download-btn:hover {
      background: transparent;
      color: var(--ink);
    }

    /* ── PII Type Tags ───────────────────────────────────── */
    .pii-tag {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.65rem;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 2px;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      display: inline-block;
      vertical-align: middle;
    }
    .pii-tag--NAME       { background: #E8C4C0; color: #6B2720; }
    .pii-tag--EMAIL      { background: #C0D4E8; color: #1E3A5F; }
    .pii-tag--PHONE      { background: #C0E8C4; color: #1C4A22; }
    .pii-tag--COMPANY    { background: #E8DFC0; color: #5A4A1C; }
    .pii-tag--ADDRESS    { background: #D4C0E8; color: #3B1E5F; }
    .pii-tag--SSN        { background: #E8CEC0; color: #5F3A1E; }
    .pii-tag--CREDIT_CARD{ background: #E8CEC0; color: #5F3A1E; }
    .pii-tag--DOB        { background: #E8CEC0; color: #5F3A1E; }
    .pii-tag--IP_ADDRESS { background: #E8CEC0; color: #5F3A1E; }

    /* ── Diff View ───────────────────────────────────────── */
    .diff-section {
      display: none;
      margin-top: 20px;
    }
    .diff-section.active { display: block; }

    .diff-header {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--stamp-red);
      margin-bottom: 8px;
    }

    .diff-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0;
      border: var(--border);
    }

    .diff-pane {
      padding: 0;
      overflow: auto;
      max-height: 70vh;
    }
    .diff-pane:first-child {
      border-right: var(--border);
    }

    .diff-pane-header {
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      padding: 10px 16px;
      background: var(--panel-bg);
      border-bottom: var(--border);
      position: sticky;
      top: 0;
      z-index: 2;
    }

    .diff-content {
      padding: 16px;
      font-size: 0.82rem;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: 'Public Sans', sans-serif;
    }

    /* Redaction bar stamp animation */
    @keyframes stamp {
      0%   { transform: scale(1.3) rotate(-2deg); opacity: 0.6; }
      60%  { transform: scale(1.0) rotate(0.5deg); opacity: 1; }
      100% { transform: scale(1.0) rotate(0deg); opacity: 1; }
    }

    .redacted-span {
      background: var(--redact-black);
      color: var(--redact-black);
      padding: 1px 4px;
      margin: 0 1px;
      display: inline;
      position: relative;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.78rem;
      animation: stamp 200ms ease-out both;
    }
    /* The replacement text appears on hover */
    .redacted-span:hover {
      color: #fff;
      cursor: help;
    }
    .redacted-span::after {
      content: attr(data-type);
      position: absolute;
      bottom: calc(100% + 3px);
      left: 0;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.55rem;
      font-weight: 600;
      text-transform: uppercase;
      color: var(--stamp-red);
      white-space: nowrap;
      pointer-events: none;
      opacity: 0;
    }
    .redacted-span:hover::after {
      opacity: 1;
    }

    /* Sequential animation delay applied via JS */

    /* PII type breakdown table */
    .breakdown-table {
      width: 100%;
      border-collapse: collapse;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.75rem;
      margin-top: 20px;
    }
    .breakdown-table th,
    .breakdown-table td {
      text-align: left;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(199,167,107,0.3);
    }
    .breakdown-table th {
      text-transform: uppercase;
      letter-spacing: 0.06em;
      font-size: 0.65rem;
      color: #777;
      font-weight: 600;
    }
    .breakdown-table td:nth-child(2) {
      font-weight: 600;
    }

    /* ── Error state ─────────────────────────────────────── */
    .error-msg {
      display: none;
      font-family: 'IBM Plex Mono', monospace;
      font-size: 0.8rem;
      color: var(--stamp-red);
      padding: 12px 16px;
      border: 1px solid var(--stamp-red);
      margin-top: 12px;
    }
    .error-msg.active { display: block; }

    /* ── Responsive ──────────────────────────────────────── */
    @media (max-width: 800px) {
      .diff-grid { grid-template-columns: 1fr; }
      .diff-pane:first-child { border-right: none; border-bottom: var(--border); }
      .stats-row { gap: 12px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>PII Redaction Tool</h1>
    <span class="case-number">Case File ░ Document Review</span>
  </div>

  <div class="app">

    <!-- Upload Panel -->
    <div class="upload-panel" id="uploadPanel">
      <span class="upload-label">Submit Document for Redaction</span>
      <p>Drag &amp; drop a <strong>.docx</strong> file or click to browse. Max 50 MB.</p>
      <div class="file-input-wrap">
        <span class="file-btn">Choose File</span>
        <input type="file" id="fileInput" accept=".docx">
      </div>
      <span class="selected-file" id="selectedFile"></span>
      <button class="redact-btn" id="redactBtn" disabled>▸ Redact Document</button>
      <div class="progress-bar-wrap" id="progressWrap">
        <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
        <div class="progress-status" id="progressStatus">Processing…</div>
      </div>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Results Bar -->
    <div class="results-bar" id="resultsBar">
      <div class="stats-row" id="statsRow"></div>
      <a class="download-btn" id="downloadBtn" href="#" download>↓ Download Redacted</a>
    </div>

    <!-- Type Breakdown -->
    <div class="diff-section" id="breakdownSection">
      <span class="diff-header">Redaction Breakdown</span>
      <table class="breakdown-table" id="breakdownTable">
        <thead><tr><th>PII Type</th><th>Count</th><th>Unique Values</th></tr></thead>
        <tbody id="breakdownBody"></tbody>
      </table>
    </div>

    <!-- Diff View -->
    <div class="diff-section" id="diffSection">
      <span class="diff-header">Before / After Comparison</span>
      <div class="diff-grid">
        <div class="diff-pane">
          <div class="diff-pane-header">Original</div>
          <div class="diff-content" id="diffOriginal"></div>
        </div>
        <div class="diff-pane">
          <div class="diff-pane-header">Redacted</div>
          <div class="diff-content" id="diffRedacted"></div>
        </div>
      </div>
    </div>

  </div>

  <script>
    const fileInput     = document.getElementById('fileInput');
    const selectedFile  = document.getElementById('selectedFile');
    const redactBtn     = document.getElementById('redactBtn');
    const uploadPanel   = document.getElementById('uploadPanel');
    const progressWrap  = document.getElementById('progressWrap');
    const progressFill  = document.getElementById('progressFill');
    const progressStatus= document.getElementById('progressStatus');
    const errorMsg      = document.getElementById('errorMsg');
    const resultsBar    = document.getElementById('resultsBar');
    const statsRow      = document.getElementById('statsRow');
    const downloadBtn   = document.getElementById('downloadBtn');
    const breakdownSection = document.getElementById('breakdownSection');
    const breakdownBody = document.getElementById('breakdownBody');
    const diffSection   = document.getElementById('diffSection');
    const diffOriginal  = document.getElementById('diffOriginal');
    const diffRedacted  = document.getElementById('diffRedacted');

    let chosenFile = null;

    // ── Drag-and-drop ──
    uploadPanel.addEventListener('dragover', e => { e.preventDefault(); uploadPanel.classList.add('drag-over'); });
    uploadPanel.addEventListener('dragleave', () => uploadPanel.classList.remove('drag-over'));
    uploadPanel.addEventListener('drop', e => {
      e.preventDefault();
      uploadPanel.classList.remove('drag-over');
      if (e.dataTransfer.files.length && e.dataTransfer.files[0].name.endsWith('.docx')) {
        chosenFile = e.dataTransfer.files[0];
        selectedFile.textContent = chosenFile.name + ' (' + (chosenFile.size / 1024).toFixed(0) + ' KB)';
        redactBtn.disabled = false;
      }
    });

    // ── File input ──
    fileInput.addEventListener('change', () => {
      if (fileInput.files.length) {
        chosenFile = fileInput.files[0];
        selectedFile.textContent = chosenFile.name + ' (' + (chosenFile.size / 1024).toFixed(0) + ' KB)';
        redactBtn.disabled = false;
      }
    });

    // ── Redact ──
    redactBtn.addEventListener('click', async () => {
      if (!chosenFile) return;

      // Reset UI
      errorMsg.classList.remove('active');
      resultsBar.classList.remove('active');
      breakdownSection.classList.remove('active');
      diffSection.classList.remove('active');

      // Show progress
      redactBtn.disabled = true;
      progressWrap.classList.add('active');
      progressFill.style.width = '15%';
      progressStatus.textContent = 'Uploading…';

      const formData = new FormData();
      formData.append('file', chosenFile);

      try {
        progressFill.style.width = '35%';
        progressStatus.textContent = 'Processing document — detecting PII…';

        const resp = await fetch('/redact', { method: 'POST', body: formData });

        progressFill.style.width = '80%';
        progressStatus.textContent = 'Generating redacted output…';

        if (!resp.ok) {
          const errData = await resp.json().catch(() => ({ detail: 'Server error' }));
          throw new Error(errData.detail || 'Redaction failed');
        }

        const data = await resp.json();

        progressFill.style.width = '100%';
        progressStatus.textContent = 'Done';

        setTimeout(() => {
          progressWrap.classList.remove('active');
          renderResults(data);
        }, 400);

      } catch (err) {
        progressWrap.classList.remove('active');
        errorMsg.textContent = '✕ ' + err.message;
        errorMsg.classList.add('active');
        redactBtn.disabled = false;
      }
    });

    // ── Render Results ──
    function renderResults(data) {
      const summary = data.summary;

      // Stats row
      statsRow.innerHTML = '';
      const totalStat = makeStat(summary.total_redactions, 'Total Redactions');
      statsRow.appendChild(totalStat);

      for (const [type, count] of Object.entries(summary.by_type || {}).sort((a,b) => b[1]-a[1])) {
        statsRow.appendChild(makeStat(count, type));
      }

      // Download
      if (data.redacted_file_url) {
        downloadBtn.href = data.redacted_file_url;
        downloadBtn.style.display = 'inline-block';
      }

      resultsBar.classList.add('active');

      // Breakdown table
      breakdownBody.innerHTML = '';
      const uniqueMappings = summary.unique_mappings || {};
      for (const [type, count] of Object.entries(summary.by_type || {}).sort((a,b) => b[1]-a[1])) {
        const tr = document.createElement('tr');
        tr.innerHTML = `<td><span class="pii-tag pii-tag--${type}">${type}</span></td><td>${count}</td><td>${uniqueMappings[type] || '-'}</td>`;
        breakdownBody.appendChild(tr);
      }
      breakdownSection.classList.add('active');

      // Diff view
      if (data.original_text_preview && data.redacted_text_preview) {
        diffOriginal.textContent = data.original_text_preview;

        // Build the redacted pane with animated redaction bars
        renderRedactedDiff(data.redacted_text_preview, data.redaction_log || []);
        diffSection.classList.add('active');
      }

      redactBtn.disabled = false;
    }

    function makeStat(value, label) {
      const div = document.createElement('div');
      div.className = 'stat';
      div.innerHTML = `<div class="stat-value">${value}</div><div class="stat-label">${label}</div>`;
      return div;
    }

    function renderRedactedDiff(text, log) {
      // For the redacted pane, we insert span elements with the stamp animation
      // Use the redaction log to identify where replacements were made
      // Since the log references positions in the ORIGINAL text, we just
      // show the redacted text with fake values highlighted.

      // Simple approach: find fake values in the redacted text and wrap them
      const fakeValues = new Set();
      const fakeTypeMap = {};
      for (const entry of log) {
        if (entry.replacement) {
          fakeValues.add(entry.replacement);
          fakeTypeMap[entry.replacement] = entry.pii_type;
        }
      }

      // Sort by length descending to match longer fakes first
      const sortedFakes = [...fakeValues].sort((a,b) => b.length - a.length);

      // Build annotated HTML
      let html = escapeHtml(text);

      // We need to carefully replace fake values in the HTML
      // Do this by scanning and building spans
      let spanIndex = 0;
      for (const fake of sortedFakes) {
        const escaped = escapeHtml(fake);
        const type = fakeTypeMap[fake] || 'UNKNOWN';
        // Replace all occurrences with a span
        const placeholder = `<span class="redacted-span" data-type="${type}" style="animation-delay: ${spanIndex * 30}ms">${escaped}</span>`;
        html = html.split(escaped).join(placeholder);
        spanIndex++;
      }

      diffRedacted.innerHTML = html;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  </script>
</body>
</html>
